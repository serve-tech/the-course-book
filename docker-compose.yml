services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coursebook
      POSTGRES_PASSWORD: coursebook
      POSTGRES_DB: coursebook
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursebook -d coursebook"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  db-data:
