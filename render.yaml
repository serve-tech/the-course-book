# Render Blueprint for coursebook.golf: the source of truth for Render
# infrastructure (services, plans, regions, builds, routes, headers, the
# database). It declares no environment variables. Every variable, secret or
# not and including DATABASE_URL, lives in Doppler, which syncs it to each
# service; a Blueprint sync keeps variables this file omits
# (.planning/decisions/2026-10-05-doppler-is-the-single-source-of-truth-for-render-environment-variables.md,
# variables listed in docs/architecture.md#production-configuration).
# Schema: https://render.com/schema/render.yaml.json
#
# Service names set the onrender.com hostnames. coursebook-api.onrender.com is
# taken by another account, hence the coursebook-golf- prefix.
#
# Production runs on free plans for now (.planning/research/2026-09-25-free-tier-hosting.md):
# the API sleeps after 15 idle minutes and takes seconds to about a minute to
# wake, and free Postgres has no backups and expires 30 days after creation, so
# coursebook-db must move to basic-256mb with diskSizeGB 1 before it expires
# (docs/cutover.md). coursebook-golf-api moves to starter before the mobile apps
# ship. Omitting `plan` selects a paid plan, so every resource states one.
#
# The API and database run in Ohio (us-east-2), closest to most members; the
# static site is served from Render's global CDN and has no region. Render
# cannot change a region in place: moving means recreating the resource.
#
# Commit-triggered deploys wait for the commit's CI checks (autoDeployTrigger:
# checksPass). Blueprint syncs deploy without waiting, so branch protection on
# main (required checks) is what keeps failing commits out.
databases:
  - name: coursebook-db
    plan: free
    region: ohio
    postgresMajorVersion: "17"

services:
  # JSON API for the web, iOS and Android clients. Migrations run when the
  # container starts (free plans have no pre-deploy step).
  - type: web
    name: coursebook-golf-api
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/domain/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json

  # The web app: a static single-page app on Render's CDN. Free, and it does
  # not sleep; its data comes from coursebook-golf-api.
  - type: web
    name: coursebook-golf-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: corepack pnpm install --frozen-lockfile --filter @coursebook/web... && corepack pnpm --filter @coursebook/web build
    staticPublishPath: ./apps/web/build/client
    buildFilter:
      paths:
        - apps/web/**
        - packages/domain/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
    # Client-side routes (/friends/x, /account) load the app shell.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Keep in step with tests/e2e/static-server.ts.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
